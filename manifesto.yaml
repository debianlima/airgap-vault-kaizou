procedencia_externa:
- entrada: 802
  problema: aceitar sol-sign-request real do Solflare quando signData é transação
    Solana serializada completa e não apenas mensagem
  degraus_tentados:
  - '1: implementação atual localizada em src/app/services/solflare-keystone/solflare-keystone.service.ts;
    helper sempre embrulhava signData como mensagem'
  - '2: airgap-wallet-engineering-skill v0.1.1 confirmou fronteira offline-transport/host-wallet
    e exigência de oráculo externo'
  - '5: firmware Keystone fixado confirma classificação por conteúdo entre Transaction
    e Message'
  - '6: @solana/wallet-adapter-keystone@0.1.19 confirma transaction.serialize() para
    VersionedTransaction e serializeMessage() para Transaction legado'
  adotado_de: https://github.com/KeystoneHQ/keystone3-firmware/blob/6ab436a2c34a5bcce2e72aae1e6ff8ee43bf057f/rust/rust_c/src/solana/mod.rs
  fonte_complementar: https://www.npmjs.com/package/@solana/wallet-adapter-keystone/v/0.1.19
  acessado_em: '2026-08-23'
  licenca: Apache-2.0
  alteracoes: adaptar somente a normalização host para preservar transação serializada
    completa ou criar envelope de assinaturas quando signData for mensagem; sem copiar
    parser Rust
  teste_de_aceite: src/app/services/solflare-keystone/solflare-keystone.service.spec.ts
- entrada: 802
  problema: converter o endereço Solana Base58 exibido pela conta para os 32 bytes
    Ed25519 que o contrato Keystone crypto-multi-accounts e a seleção de assinatura
    exigem
  degraus_tentados:
  - '1: busca no repositório não encontrou codec Base58 próprio; `wallet.receivingPublicAddress`
    é a fonte que coincide mecanicamente com o signer real homologado'
  - '2: airgap-wallet-engineering-skill v0.2.0 exige preservar a fronteira host/protocolo
    e testar com oráculo determinístico'
  - '6: pacote bs58 4.0.1 já presente transitivamente no lock fornece codec Base58
    puro e licenciado MIT; passa a ser dependência direta para evitar depender de
    transitividade'
  adotado_de: https://github.com/cryptocoinjs/bs58/tree/v4.0.1
  acessado_em: '2026-08-23'
  licenca: MIT
  alteracoes: expor helper host que decodifica endereço Solana Base58 e exige exatamente
    32 bytes; account-share e interaction reutilizam o mesmo helper para impedir divergência
    entre pareamento e resposta
  teste_de_aceite: src/app/pages/account-share/account-share.page.spec.ts
- entrada: 802
  problema: fixar a semântica de assinatura Solflare para transações Solana V3/CLMM
    sem confundir `SignType.Message` com assinatura de texto
  degraus_tentados:
  - '1: o repositório já preservava mensagens v0 e respostas `sol-signature`, mas
    descartava o `signType` depois da decodificação e escolhia a forma do payload
    por heurística'
  - '2: airgap-wallet-engineering-skill 0.2.0 exige oráculo byte-a-byte e fronteira
    de protocolo explícita'
  - '5: Solflare SDK público declara `signTransaction(TransactionOrVersionedTransaction)`
    e o protocolo Solana wallet-adapter documenta `signTransaction` como assinatura
    destacada de `transaction.serializeMessage()`'
  - '5: documentação PancakeSwap confirma pools V3 Solana de liquidez concentrada;
    pacote `@pancakeswap/solana-core-sdk` 0.2.1 é usado pelo frontend e deriva do
    Raydium SDK V2'
  adotado_de: https://github.com/solflare-wallet/solflare-sdk
  acessado_em: '2026-08-23'
  licenca: Apache-2.0
  alteracoes: nenhuma cópia de algoritmo; somente tornar explícita no host a distinção
    `Message` versus `Transaction` e reforçar o teste de preservação byte-a-byte
  teste_de_aceite: src/app/services/solflare-keystone/solflare-keystone.service.spec.ts
- entrada: 939
  problema: derivar uma matriz adversarial de assinatura a partir de falhas observadas
    por desenvolvedores Solana sem copiar transações privadas de terceiros
  degraus_tentados:
  - '1: repositório não continha matriz/fuzzer equivalente para signing'
  - '2: airgap-wallet-engineering-skill 0.2.3 exige source-to-wire, byte equality
    e oráculo externo'
  - '5: documentação oficial Solana fixa signers, mensagem, blockhash e limites; anza
    wallet-adapter fixa Transaction|VersionedTransaction na fronteira da wallet'
  - '7: Solana Stack Exchange forneceu formas de falha reproduzíveis: assinatura perdida
    por não usar retorno de signTransaction, mutação de blockhash após assinatura,
    missing signer, partial signing, ALT não resolvida, durable nonce/ComputeBudget
    e signer incorreto'
  adotado_de: https://solana.stackexchange.com/questions/5643/signature-verification-failed
  fonte_complementar: https://solana.stackexchange.com/questions/3919/how-can-i-send-a-signed-transaction-to-the-chain-without-a-signer-in-the-backend
    ; https://solana.stackexchange.com/questions/5007/partial-sign-transaction-from-front-end
    ; https://solana.stackexchange.com/questions/4808/what-does-failed-to-get-account-keys-because-address-table-lookups-were-not-res
    ; https://solana.stackexchange.com/questions/7497/blockhash-not-found-when-using-nonce
    ; https://github.com/anza-xyz/wallet-adapter/tree/ca731858affa36fa91b593cc670747b671c4589f
  acessado_em: '2026-08-24'
  licenca: CC-BY-SA-4.0 para posts Stack Exchange; Apache-2.0 para anza wallet-adapter
  alteracoes: nenhum código/transação de usuário copiado; somente categorias de falha
    convertidas em fixtures sintéticas determinísticas com chaves e blockhashes de
    teste
  teste_de_aceite: scripts/airgap-vault-kaizou-solana-signing-simulation.js
