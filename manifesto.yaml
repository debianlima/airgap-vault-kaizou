  origem: decisão do usuário de manter a Skill atual vinculada ao módulo e ao Kaizou
    e integrar no Kaizou todo o escopo Solana suportado pelo parser Keystone, sem
    alterar outras redes
  alteracoes:
  - AirGap Vault Kaizou passa à versão de desenvolvimento 1.1.1 porque 1.1.0 já foi
    publicada e permanece imutável
  - release candidata integra exatamente airgap-solana-module 0.1.5 como static asset
    module assinado
  - pacote 0.1.5 deve classificar offline as famílias System, Vote, Stake, SPL Token,
    SPL Token Swap v3, SPL Token Lending, Squads v4, Jupiter v6 e Compute Budget tratadas
    pelo parser Keystone fixado
  - stake já homologado deve permanecer semanticamente inalterado e a regressão específica
    de liquidity pool não pode exibir Solana transaction not recognized offline
  - fluxos, arquivos e branches de protocolos não-Solana não podem sofrer alteração
    semântica
  - a mesma airgap-wallet-engineering-skill 0.1.0 fica vinculada aos dois projetos;
    próximo módulo de outra moeda deve derivar uma skill nova da atual
- versao: 11
  data: '2026-08-23'
  origem: decodificação mecânica do vídeo real enviado pelo usuário; o UR é sol-sign-request
    multipart e usa SignType.Message
  alteracoes:
  - o vídeo real decodifica em fountain UR com seqLen 3; quatro frames distintos bastaram
    para reconstruir o payload completo sem erro
  - o request real usa SignType.Message (valor 2), caminho 44'/501'/0'/0', fingerprint
    da carteira e mensagem Solana v0 com dois signatários obrigatórios
  - SolflareSignRequestHandler deve aceitar SignType.Transaction e SignType.Message;
    ambos representam solicitação de assinatura de transação Solana e convergem para
    o mesmo envelope de transação não assinada do Vault
  - rejeitar SignType.Message produz exatamente o alerta genérico Incompatible code
    após o UR completar; esse é o defeito observado na release 1.1.1
  - a release continua 1.1.2 e o módulo integrado continua 0.1.5; a correção é exclusivamente
    na ponte host Solflare/Keystone
- versao: 10
  data: '2026-08-23'
  origem: captura real fornecida pelo usuário de QR dinâmico Solflare rejeitado pelo
    Vault Kaizou 1.1.1 como Incompatible code
  alteracoes:
  - o frame capturado decodifica como UR:SOL-SIGN-REQUEST multipart e o URDecoder
    o aceita como fragmento parcial; o QR não pode ser tratado como código incompatível
    só por ser animado
  - Kaizou passa à versão de desenvolvimento 1.1.2; airgap-solana-module permanece
    0.1.5 porque a falha está na ponte host Solflare/Keystone
  - sol-sign-request deve aceitar signData tanto como mensagem Solana quanto como
    transação Solana serializada completa, conforme o comportamento suportado pelo
    firmware Keystone
  - transação completa recebida via UR não pode receber um segundo prefixo de assinaturas
    antes de chegar ao módulo Solana
  - QR fountain multipart deve acumular fragmentos até SUCCESS sem cair no alerta
    genérico Incompatible code
  - redes não-Solana permanecem semanticamente inalteradas
