name: Publish consolidated source and licensing release

on:
  push:
    branches: [master]
    paths:
      - releases/airgap-vault-kaizou-1.1.3.md

permissions:
  contents: write

concurrency:
  group: airgap-vault-kaizou-1.1.3-release
  cancel-in-progress: false

jobs:
  publish-and-supersede:
    if: github.repository == 'debianlima/airgap-vault-kaizou'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source licensing controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.1.3"
          test -s LICENSE.md
          test -s THIRD_PARTY_NOTICES.md
          test -s MODIFICATIONS.md
          test -s LEGAL_AUDIT.md
          grep -q 'THIRD_PARTY_NOTICES.md' README.md
          grep -q 'aa50b7f0371ed2e681f358d22b546c7c000e05b7' MODIFICATIONS.md
          grep -q 'source/licensing documentation only' LEGAL_AUDIT.md
          grep -q 'AirGap Vault v3.34.4' src/app/services/iac/iac.service.ts

      - name: Build legal and provenance archive
        shell: bash
        run: |
          set -euo pipefail
          archive='airgap-vault-kaizou-1.1.3-license-provenance.zip'
          mkdir -p release-out/license-provenance
          cp LICENSE.md THIRD_PARTY_NOTICES.md MODIFICATIONS.md LEGAL_AUDIT.md README.md competencias.yaml estado.md package.json yarn.lock release-out/license-provenance/
          cp releases/airgap-vault-kaizou-1.1.3.md release-out/license-provenance/RELEASE_NOTES.md
          (cd release-out && zip -q -r "$archive" license-provenance)
          (cd release-out && sha256sum "$archive" > "$archive.sha256")

      - name: Publish and verify replacement release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='airgap-vault-kaizou-1.1.3'
          notes='releases/airgap-vault-kaizou-1.1.3.md'
          archive='release-out/airgap-vault-kaizou-1.1.3-license-provenance.zip'
          checksum="$archive.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force
            gh release edit "$tag" --title 'AirGap Vault Kaizou 1.1.3 — source, licenses and provenance' --notes-file "$notes" --draft=false --prerelease=false
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title 'AirGap Vault Kaizou 1.1.3 — source, licenses and provenance' --notes-file "$notes" "$archive" "$checksum"
          fi
          gh release upload "$tag" "$archive" "$checksum" --clobber
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = false
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'airgap-vault-kaizou-1.1.3-license-provenance.zip'
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'airgap-vault-kaizou-1.1.3-license-provenance.zip.sha256'
          tmp="$(mktemp -d)"
          gh release download "$tag" --dir "$tmp" --pattern 'airgap-vault-kaizou-1.1.3-license-provenance.zip*'
          (cd "$tmp" && sha256sum -c airgap-vault-kaizou-1.1.3-license-provenance.zip.sha256)

      - name: Remove superseded release pages and keep tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          replacement='airgap-vault-kaizou-1.1.3'
          while IFS= read -r old_tag; do
            if [ -n "$old_tag" ] && [ "$old_tag" != "$replacement" ]; then
              gh release delete "$old_tag" --yes
            fi
          done < <(gh api --paginate repos/${{ github.repository }}/releases --jq '.[].tag_name')
          test "$(gh api --paginate repos/${{ github.repository }}/releases --jq '.[].tag_name')" = "$replacement"
          for old_tag in airgap-vault-kaizou-1.0.0 airgap-vault-kaizou-1.1.0 airgap-vault-kaizou-1.1.1 airgap-vault-kaizou-1.1.2; do
            git ls-remote --exit-code --tags origin "refs/tags/$old_tag" >/dev/null
          done
